<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The vessel, simplified for a favicon. Renders at 16px, where the eight
    petals of the full mark collapse into a smudge — so this carries five
    fatter petals and a larger egg, and drops the glow, which is invisible
    at that size and only muddies the silhouette.
  -->
  <rect width="100" height="100" fill="#d6a09b"/>
  <g transform="translate(50,76)">
    <g fill="#5a121c">
      <path transform="rotate(-116)" d="M0,0 C-7,-12 -7,-26 0,-36 C7,-26 7,-12 0,0 Z"/>
      <path transform="rotate(116)" d="M0,0 C-7,-12 -7,-26 0,-36 C7,-26 7,-12 0,0 Z"/>
    </g>
    <g fill="#75231f">
      <path transform="rotate(-70)" d="M0,0 C-8,-15 -8,-32 0,-44 C8,-32 8,-15 0,0 Z"/>
      <path transform="rotate(70)" d="M0,0 C-8,-15 -8,-32 0,-44 C8,-32 8,-15 0,0 Z"/>
    </g>
  </g>
  <path fill="#fbeee7" d="M50,22 C60,22 67,37 67,52 C67,66 60,76 50,76 C40,76 33,66 33,52 C33,37 40,22 50,22 Z"/>
  <g transform="translate(50,76)" fill="#8e2f2a">
    <path transform="rotate(-34)" d="M0,0 C-8,-16 -8,-34 0,-47 C8,-34 8,-16 0,0 Z"/>
    <path transform="rotate(34)" d="M0,0 C-8,-16 -8,-34 0,-47 C8,-34 8,-16 0,0 Z"/>
  </g>
</svg>
